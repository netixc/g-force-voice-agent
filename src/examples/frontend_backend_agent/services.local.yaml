# GPU speech services with OpenRouter-hosted language models.
consumer:
  llm:
    nemotron-nano:
      name: "Gemini 3.7 Flash on OpenRouter"
      provider: openrouter
      model_id: "google/gemini-3.7-flash"
      base_url: "https://openrouter.ai/api/v1"
      system_prompt: ""
      max_tokens: 2048
      extra_params: '{"extra_body":{"reasoning":{"effort":"low"}}}'
  agent-server:
    pi:
      name: "Pi Chief-of-Staff Agent"
      server: "http://pi-agent:8787"
  tts:
    magpie-multilingual-tts:
      name: "Kokoro ONNX (Local GPU)"
      provider: kokoro
      server: "in-process"
      voice_id: "af_heart"
      model: "kokoro-v1.0"
      language_code: "en-US"
  asr:
    nemotron-asr-streaming-english:
      name: "Faster Whisper Large V3 Turbo (Local GPU)"
      provider: faster-whisper
      server: "in-process"
      model: "deepdml/faster-whisper-large-v3-turbo-ct2"
      language_code: "en-US"

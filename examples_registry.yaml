selection: frontend-backend-agent
transports: all

examples:
  frontend-backend-agent:
    label: Ava Chief of Staff
    welcome_message: false
    slots: [llm, agent-server, thinker-llm, booking-server, asr, tts]
    defaults:
      prompt: [chief]
      llm: [nemotron-nano]
      agent-server: [pi]
      thinker-llm: [nemotron-nano]
      booking-server: [default]
      asr: [nemotron-asr-streaming-english]
      tts: [magpie-multilingual-tts]
    bot: examples.frontend_backend_agent.pipeline:bot

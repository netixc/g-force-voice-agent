name: g-force-voice-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: g-force-voice-agent:latest

services:
  model-init:
    <<: *app-image
    command: ["uv", "run", "python", "src/prefetch_models.py"]
    environment:
      FASTER_WHISPER_MODEL: ${FASTER_WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      HF_DOWNLOAD_WORKERS: ${HF_DOWNLOAD_WORKERS:-1}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-true}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./src:/app/src:ro
      - model-cache:/root/.cache
    restart: "no"
    logging: *default-logging

  voice-agent:
    <<: *app-image
    command: ["uv", "run", "python", "src/server.py", "--host", "0.0.0.0"]
    ports:
      - "${PIPELINE_APP_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      APP_RUNTIME: container
      PLATFORM: consumergpu
      EXAMPLE_SELECTION: frontend-backend-agent
      TRANSPORT_SELECTION: ${TRANSPORT_SELECTION:-}
      PIPELINE_TLS: ${PIPELINE_TLS:-true}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-cuda}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-float16}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-true}
      ONNX_PROVIDER: ${ONNX_PROVIDER:-CUDAExecutionProvider}
      AGENT_BACKEND: ${AGENT_BACKEND:-pi}
      PI_AGENT_URL: ${PI_AGENT_URL:-http://pi-agent:8787}
      PI_AGENT_TIMEOUT_SECONDS: ${PI_AGENT_TIMEOUT_SECONDS:-300}
      FRONTEND_BACKEND_DIRECT_TOOL_RESPONSE: ${FRONTEND_BACKEND_DIRECT_TOOL_RESPONSE:-true}
    volumes:
      - ./src:/app/src:ro
      - ./examples_registry.yaml:/app/examples_registry.yaml:ro
      - model-cache:/root/.cache
    depends_on:
      model-init:
        condition: service_completed_successfully
      pi-agent:
        condition: service_healthy
      booking-server:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fk $$(test \"$$(printf %s \"$${PIPELINE_TLS:-true}\" | tr '[:upper:]' '[:lower:]')\" = true && echo https || echo http)://localhost:7860/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  pi-agent:
    build:
      context: .
      dockerfile: docker/PiAgent.Dockerfile
    image: g-force-pi-agent-service:latest
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      PORT: "8787"
      PI_WORKSPACE: /workspace
      PI_AGENT_DIR: /agent-data
      PI_PROVIDER: ${CHIEF_PI_PROVIDER:-openrouter}
      PI_MODEL: ${CHIEF_PI_MODEL:-google/gemini-3.7-flash}
      PI_THINKING_LEVEL: ${CHIEF_PI_THINKING_LEVEL:-low}
      PI_TOOLS: ${CHIEF_PI_TOOLS:-read,grep,find,ls}
      PI_MAX_WORKERS: ${CHIEF_PI_MAX_WORKERS:-2}
    expose:
      - "8787"
    volumes:
      - ./workspace:/workspace
      - pi-agent-data:/agent-data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  booking-server:
    <<: *app-image
    command: ["uv", "run", "python", "-m", "examples.frontend_backend_agent.airline.database.server"]
    environment:
      APP_RUNTIME: container
      PYTHONPATH: /app/src
      BOOKING_HOST: "0.0.0.0"
      BOOKING_PORT: "8001"
      BOOKING_DB_PATH: /app/data/bookings.db
    ports:
      - "${BOOKING_SERVER_PORT:-8001}:8001"
    volumes:
      - ./src:/app/src:ro
      - booking-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  model-cache:
    name: ${MODEL_CACHE_VOLUME:-g-force-voice-agent_model_cache}
  booking-data:
    name: ${BOOKING_DATA_VOLUME:-g-force-voice-agent_booking_data}
  pi-agent-data:
    name: ${PI_AGENT_DATA_VOLUME:-g-force-voice-agent_pi_agent_data}

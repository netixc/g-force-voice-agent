name: chief-os

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: chief-os:latest

services:
  model-init:
    <<: *app-image
    command: ["uv", "run", "python", "src/prefetch_models.py"]
    environment:
      FASTER_WHISPER_MODEL: ${FASTER_WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-cuda}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-float16}
      HF_DOWNLOAD_WORKERS: ${HF_DOWNLOAD_WORKERS:-1}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-true}
      HF_TOKEN: ${HF_TOKEN:-}
      ONNX_PROVIDER: ${ONNX_PROVIDER:-CUDAExecutionProvider}
    volumes:
      - ./src:/app/src:ro
      - model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: "no"
    logging: *default-logging

  voice-agent:
    <<: *app-image
    command: ["uv", "run", "python", "src/server.py", "--host", "0.0.0.0"]
    ports:
      - "${PIPELINE_APP_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      APP_RUNTIME: container
      PLATFORM: consumergpu
      EXAMPLE_SELECTION: frontend-backend-agent
      TRANSPORT_SELECTION: ${TRANSPORT_SELECTION:-}
      PIPELINE_TLS: ${PIPELINE_TLS:-true}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-cuda}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-float16}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-true}
      ONNX_PROVIDER: ${ONNX_PROVIDER:-CUDAExecutionProvider}
      PI_AGENT_URL: ${PI_AGENT_URL:-http://pi-agent:8787}
      PI_AGENT_TIMEOUT_SECONDS: ${PI_AGENT_TIMEOUT_SECONDS:-300}
      FRONTEND_BACKEND_DIRECT_TOOL_RESPONSE: ${FRONTEND_BACKEND_DIRECT_TOOL_RESPONSE:-true}
    volumes:
      - ./src:/app/src:ro
      - ./examples_registry.yaml:/app/examples_registry.yaml:ro
      - model-cache:/root/.cache
    depends_on:
      model-init:
        condition: service_completed_successfully
      pi-agent:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fk $$(test \"$$(printf %s \"$${PIPELINE_TLS:-true}\" | tr '[:upper:]' '[:lower:]')\" = true && echo https || echo http)://localhost:7860/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  pi-auth-init:
    image: node:22-bookworm-slim
    profiles: [setup]
    user: "0:0"
    command:
      - node
      - -e
      - |
        const fs = require("node:fs");
        const source = JSON.parse(fs.readFileSync("/source/auth.json", "utf8"));
        if (!source["openai-codex"]) throw new Error("Host Pi has no openai-codex credential; run /login first");
        fs.writeFileSync("/agent-data/auth.json", JSON.stringify({ "openai-codex": source["openai-codex"] }), { mode: 0o600 });
        fs.chownSync("/agent-data/auth.json", 1000, 1000);
    volumes:
      - ${PI_AUTH_FILE:-/root/.pi/agent/auth.json}:/source/auth.json:ro
      - pi-agent-data:/agent-data
    restart: "no"

  pi-agent:
    build:
      context: .
      dockerfile: docker/PiAgent.Dockerfile
    image: chief-os-pi-agent-service:latest
    environment:
      PORT: "8787"
      PI_WORKSPACE: /workspace
      PI_AGENT_DIR: /agent-data
      PI_PROVIDER: ${PI_AGENT_PROVIDER:-${CHIEF_PI_PROVIDER:-openai-codex}}
      PI_MODEL: ${PI_AGENT_MODEL:-${CHIEF_PI_MODEL:-gpt-5.6-sol}}
      PI_THINKING_LEVEL: ${PI_AGENT_THINKING_LEVEL:-${CHIEF_PI_THINKING_LEVEL:-low}}
      PI_TOOLS: ${PI_AGENT_TOOLS:-${CHIEF_PI_TOOLS:-read,grep,find,ls}}
      PI_MAX_WORKERS: ${PI_AGENT_MAX_WORKERS:-${CHIEF_PI_MAX_WORKERS:-2}}
    expose:
      - "8787"
    volumes:
      - ./workspace:/workspace
      - pi-agent-data:/agent-data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

volumes:
  model-cache:
    name: ${MODEL_CACHE_VOLUME:-chief-os_model_cache}
  pi-agent-data:
    name: ${PI_AGENT_DATA_VOLUME:-chief-os_pi_agent_data}
